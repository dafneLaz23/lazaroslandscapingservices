        color:#1e293b;

        .section-title p{
        color:#666;
        font-size:18px;
        }

        /* GALLERY GRID */
        .gallery-grid{
        display:grid;
        grid-template-columns:repeat(auto-fit, minmax(300px, 1fr));
        gap:25px;
        }

        /* GALLERY ITEMS */
        .gallery-item{
        overflow:hidden;
        border-radius:18px;
        box-shadow:0 10px 25px rgba(0,0,0,0.08);
        background:white;
        }

        /* IMAGES */
        .gallery-item img{
        width:100%;
        height:320px;
        object-fit:cover;
        display:block;
        transition:0.4s ease;
        }

        /* HOVER EFFECT */
        .gallery-item:hover img{
        transform:scale(1.05);
        }
    </style>
